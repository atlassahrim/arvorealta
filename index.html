<div id="root">

       createRoot clears this the moment React is up; if it never is, the

const { useState, useEffect, useCallback } = React;
/* ------------------------------------------------------------ language

   shipping all three costs less than a round trip would, and a reader who
   switches gets the new language in the same frame.

   WHAT IS NEVER TRANSLATED. The tender's own title, and the names of its
   annexes: Bilag 2, Bilag 3, Vedlegg 5. Those are the strings a bidder
   matches against the competition documents in front of them, and a helpful
   translation of "Vedlegg 5" into "Appendix 5" would make the page useless
   at the exact moment it is most needed. The buyer's registered name is left
   alone for the same reason. Only the country name moves.

   procurement vocabulary in them is the part worth having checked before

    },

    langLabel: "Kieli"

const LANGS = ["en", "nb", "fi"];

const html = htm.bind(React.createElement);
const M = motion;
const EASE = [0.16, 1, 0.3, 1];

function useMo() {
  const reduce = useReducedMotion();
  return {
    rise: (i = 0) => reduce ? {} : {
      initial: { opacity: 0, y: 16 }, animate: { opacity: 1, y: 0 },
      transition: { duration: .85, delay: .06 + i * .11, ease: EASE }
    },
    reveal: (i = 0) => reduce ? {} : {
      initial: { opacity: 0, y: 22 }, whileInView: { opacity: 1, y: 0 },
      viewport: { once: true, amount: .25 },
      transition: { duration: .7, delay: i * .08, ease: EASE }
    },
    press: reduce ? {} : { whileHover: { y: -1 }, whileTap: { scale: .985 } }
  };
}

const WRAP = "mx-auto w-full max-w-[82rem] px-5 sm:px-8";
const ANCHOR = "scroll-mt-[92px]";
const MAILTO = "mailto:atlas@arvorealta.com?subject=One%20page%20from%20a%20tender%20we%20lost";

function Eyebrow({ children, on = "flat" }) {
  const tone = on === "photo" ? "text-ink/75 dark:text-bone/75" : "text-brick dark:text-brick-l";
  return html`<p class="font-mono text-[11px] uppercase tracking-[.18em] ${tone}">${children}</p>`;
}

function Action({ href, children, tone = "solid", class: extra = "", ...rest }) {
  const mo = useMo();
  const base = "inline-flex items-center justify-center whitespace-nowrap rounded-full px-6 py-3 text-[15px] font-medium transition-colors";
  const tones = {
    solid: "bg-ink text-bone hover:bg-ink/90 dark:bg-bone dark:text-ink dark:hover:bg-bone/90",
    ghost: "border border-ink/25 text-ink hover:border-ink/60 dark:border-bone/30 dark:text-bone dark:hover:border-bone/70"
  };
  return html`<${M.a} href=${href} class="${base} ${tones[tone]} ${extra}" ...${mo.press} ...${rest}>${children}<//>`;
}

/* The language control is three letters rather than a dropdown. There are
   exactly three, a select would hide two of them behind a tap, and the
   current one has to be readable at a glance by someone who cannot read the
   other two. aria-pressed carries the state for anyone not seeing the fill. */
function LangPick({ lang, setLang, t }) {
  return html`
    <div class="flex items-center rounded-full border border-ink/20 p-[3px] dark:border-bone/25"
         role="group" aria-label=${t.langLabel}>
      ${LANGS.map(code => html`
        <button key=${code} type="button" onClick=${() => setLang(code)}
          aria-pressed=${lang === code} lang=${STR[code].htmlLang}
          title=${STR[code].label}
          class="rounded-full px-2.5 py-1 font-mono text-[11px] uppercase tracking-[.1em] transition-colors ${
            lang === code
              ? "bg-ink text-bone dark:bg-bone dark:text-ink"
              : "text-ink/60 hover:text-ink dark:text-bone/60 dark:hover:text-bone"}">
          ${STR[code].short}
        </button>`)}
    </div>`;
}

function Nav({ t, theme, onToggle, lang, setLang }) {
  const links = [[t.nav.open, "#open"], [t.nav.case, "#case"]];
  return html`
    <header class="sticky top-0 z-40 border-b border-ink/10 bg-paper/85 backdrop-blur-md dark:border-bone/10 dark:bg-ink-2/85">
      <div class="${WRAP} flex h-[68px] items-center justify-between gap-5">
        <a href="#top" class="font-mono text-[13px] uppercase tracking-[.22em]">Arvorealta</a>
        <nav class="hidden items-center gap-7 lg:flex">
          ${links.map(([l, h]) => html`
            <a key=${h} href=${h}
               class="text-[14px] text-ink/70 transition-colors hover:text-ink dark:text-bone/70 dark:hover:text-bone">${l}</a>`)}
        </nav>
        <div class="flex items-center gap-2.5">
          <${LangPick} lang=${lang} setLang=${setLang} t=${t} />
          <button type="button" onClick=${onToggle}
            aria-label=${theme === "dark" ? t.themeTo.light : t.themeTo.dark}
            class="grid size-9 shrink-0 place-items-center rounded-full border border-ink/20 transition-colors hover:border-ink/50 dark:border-bone/25 dark:hover:border-bone/60">
            <span class="font-mono text-[11px]" aria-hidden="true">${theme === "dark" ? "L" : "D"}</span>
          </button>
          <${Action} href=${MAILTO} class="hidden sm:inline-flex">${t.cta}<//>
        </div>
      </div>
    </header>`;
}

function Hero({ t }) {

  return html`

          srcset="/assets/img/gateway-3-960.webp 960w, /assets/img/gateway-3-1440.webp 1440w, /assets/img/gateway-3-1920.webp 1920w, /assets/img/gateway-3-2560.webp 2560w" />
        <img src="/assets/img/gateway-3-1920.jpg" sizes="100vw"
          srcset="/assets/img/gateway-3-960.jpg 960w, /assets/img/gateway-3-1440.jpg 1440w, /assets/img/gateway-3-1920.jpg 1920w, /assets/img/gateway-3-2560.jpg 2560w"

                  bg-[radial-gradient(135%_120%_at_52%_44%,transparent_28%,var(--color-paper-3)_70%,var(--color-paper)_99%)]

      <div class="${WRAP} relative grid min-h-[clamp(30rem,calc(100dvh-4.5rem),46rem)] content-center py-14">
        <div>
          <${M.div} ...${mo.rise(0)}><${Eyebrow} on="photo">${t.hero.eyebrow}<//><//>
          <${M.h1} ...${mo.rise(1)}
            class="mt-7 text-[clamp(2.4rem,.9rem+4.4vw,4.6rem)] font-medium leading-[1.03] tracking-[-.03em]">

          <${M.p} ...${mo.rise(2)}

function Gate({ t }) {

function OpenTender({ t }) {
  const mo = useMo();
  return html`
    <section id="open" class="${ANCHOR} ${WRAP} py-20 sm:py-28">
      <${M.div} ...${mo.reveal(0)}>
        <${Eyebrow}>${t.open.eyebrow}<//>
        <h2 class="mt-6 max-w-[20ch] text-[clamp(1.9rem,1.2rem+2.2vw,3.1rem)] font-medium leading-[1.08] tracking-[-.025em]">
          ${t.open.h2}
        </h2>
      <//>
      <${M.div} ...${mo.reveal(1)}
        class="mt-12 grid overflow-hidden rounded-2xl border border-ink/15 bg-paper-3 lg:grid-cols-[1.15fr_1fr] dark:border-bone/15 dark:bg-ink">
        <div class="border-b border-ink/12 p-8 sm:p-10 lg:border-b-0 lg:border-r dark:border-bone/12">
          <!-- The heading is in the reader's language. The Norwegian original
               is still here, because a bidder has to match it against the
               documents in front of them, but it sits on its own line under a
               label that says what it is. A quotation from another document
               reads as deliberate; the same words loose inside an English
               sentence read as a half-finished translation, which is what
               this was. -->
          <h3 class="text-[1.5rem] font-medium leading-tight tracking-[-.02em]">${t.open.title}</h3>
          ${t.open.official && html`
            <div class="mt-4">
              <p class="font-mono text-[11px] uppercase tracking-[.18em] text-ink/55 dark:text-bone/55">${t.open.official}</p>
              <p lang="nb" class="mt-1.5 text-[1.05rem] leading-snug">Leveranse av avfallsbeholdere</p>
            </div>`}
          <p class="mt-3 text-[.95rem] leading-relaxed text-ink/70 dark:text-bone/70">${t.open.buyer}</p>
          <p class="mt-7 max-w-[46ch] leading-[1.7]">${t.open.body}</p>

          <div class="mt-8 flex flex-wrap gap-3">

        </div>
        <dl class="grid content-center gap-8 p-8 sm:p-10">
          ${t.open.fields.map(([k, v]) => html`
            <div key=${k}>

              <dt class="mt-2 font-mono text-[11px] uppercase tracking-[.18em] text-ink/55 dark:text-bone/55">${k}</dt>
            </div>`)}
        </dl>
      <//>
      <${M.p} ...${mo.reveal(2)} class="mt-8 max-w-[58ch] text-[.95rem] leading-[1.7] text-ink/65 dark:text-bone/65">
        ${t.open.foot}
      <//>
    </section>`;
}

function Weighting({ t }) {
  const mo = useMo();
  const reduce = useReducedMotion();
  return html`
    <section id="case" class="${ANCHOR} bg-ink py-20 text-bone sm:py-28 dark:bg-ink">
      <div class="${WRAP}">
        <${M.h2} ...${mo.reveal(0)}
          class="max-w-[22ch] text-[clamp(1.9rem,1.2rem+2.2vw,3.1rem)] font-medium leading-[1.08] tracking-[-.025em]">
          ${t.weigh.h2}
        <//>
        <!-- min-width:auto is the default on a flex item, so the segments
             could not shrink below their own content and the bar rendered
             63/37 against the 65/35 it is reporting. min-w-0 lets flex-grow
             mean what it says. The picture must not disagree with the
             numbers; that is the whole job of this fold. -->
        <${M.div} ...${mo.reveal(1)} class="mt-12 flex w-full max-w-[56rem] overflow-hidden rounded-2xl border border-bone/20">
          ${t.weigh.segs.map(([label, pct], i) => html`
            <${M.div} key=${label}
              initial=${reduce ? false : { flexGrow: 0 }}
              whileInView=${{ flexGrow: pct }}
              viewport=${{ once: true, amount: .4 }}
              transition=${{ duration: .9, delay: .15 + i * .1, ease: EASE }}
              style=${{ flexGrow: reduce ? pct : undefined, flexBasis: 0 }}
              class="${i === 0 ? "bg-bone/15 border-r border-bone/20" : "bg-bone/[.05]"} min-w-0">
              <!-- The padding lives on an inner element, not on the flex item.
                   With border-box, padding sits inside flex-basis, so 96px of
                   it came off the 896px bar before the 65:35 split was taken
                   and the segments rendered 63.4/36.6. The bar reports the
                   award's own figures; it cannot be two points out. -->
              <div class="px-6 py-10">
                <p class="font-mono text-[2rem] leading-none tracking-[-.02em]">${pct}</p>
                <p class="mt-3 font-mono text-[11px] uppercase tracking-[.18em] text-bone/65">${label}</p>
              </div>
            <//>`)}
        <//>
        <${M.p} ...${mo.reveal(2)} class="mt-8 max-w-[56ch] leading-[1.7] text-bone/75">${t.weigh.body}<//>
      </div>
    </section>`;
}

function Close({ t }) {
  const mo = useMo();
  return html`
    <section class="${WRAP} py-24 sm:py-32">
      <${M.div} ...${mo.reveal(0)} class="max-w-[52ch]">
        <h2 class="text-[clamp(1.9rem,1.2rem+2.2vw,3.1rem)] font-medium leading-[1.08] tracking-[-.025em]">${t.close.h2}</h2>
        <p class="mt-7 leading-[1.7] text-ink/80 dark:text-bone/80">${t.close.body}</p>
        <div class="mt-10"><${Action} href=${MAILTO}>${t.cta}<//></div>
      <//>
    </section>
    <footer class="border-t border-ink/10 py-10 dark:border-bone/10">
      <div class="${WRAP} flex flex-wrap items-center justify-between gap-4 font-mono text-[11px] uppercase tracking-[.18em] text-ink/55 dark:text-bone/55">
        <span>Arvorealta</span>
        <a href="mailto:atlas@arvorealta.com" class="transition-colors hover:text-ink dark:hover:text-bone">atlas@arvorealta.com</a>
      </div>
    </footer>`;
}

function App() {
  const [theme, setTheme] = useState(() => document.documentElement.getAttribute("data-theme") || "light");
  /* The browser's own preference decides the first language, so a Norwegian
     or Finnish reader arriving cold gets their own. English is the fallback
     and the default everywhere else. A choice, once made, is remembered and
     outranks the browser from then on. */
  const [lang, setLang] = useState(() => {
    try { const s = localStorage.getItem("ar-lang"); if (s && STR[s]) return s } catch (e) {}
    const want = (navigator.languages || [navigator.language || "en"]).map(l => String(l).toLowerCase());
    for (const l of want) {
      if (l.startsWith("nb") || l.startsWith("nn") || l.startsWith("no")) return "nb";
      if (l.startsWith("fi")) return "fi";
      if (l.startsWith("en")) return "en";
    }
    return "en";
  });

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("ar-theme", theme) } catch (e) {}
  }, [theme]);

  useEffect(() => {
    document.documentElement.lang = STR[lang].htmlLang;
    try { localStorage.setItem("ar-lang", lang) } catch (e) {}
  }, [lang]);

  useEffect(() => {
    const mq = matchMedia("(prefers-color-scheme: dark)");
    const on = e => { let s = null; try { s = localStorage.getItem("ar-theme") } catch (err) {} if (!s) setTheme(e.matches ? "dark" : "light") };
    mq.addEventListener("change", on);
    return () => mq.removeEventListener("change", on);
  }, []);

  const toggle = useCallback(() => setTheme(x => x === "dark" ? "light" : "dark"), []);
  const t = STR[lang];

  /* Standard and Ladder are written and tested and are not rendered. They are
     hidden on purpose while the offer is being reconsidered, which is why the
     nav no longer carries #standard or #price: a link to a fold that is not
     on the page is a dead anchor, and this page had two of those once already.
     Put the two lines back in the fragment below and add the links to restore
     them. The components live in git history at commit ff677c8. */
  return html`
    <${React.Fragment}>
      <${Nav} t=${t} theme=${theme} onToggle=${toggle} lang=${lang} setLang=${setLang} />
      <main>
        <${Hero} t=${t} />
        <${Gate} t=${t} />
        <${OpenTender} t=${t} />
        <${Weighting} t=${t} />
        <${Close} t=${t} />
      </main>
    <//>`;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
