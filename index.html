const html = htm.bind(React.createElement);
const M = motion;
const EASE = [0.16, 1, 0.3, 1];

function useMo() {
  const reduce = useReducedMotion();
  return {
    rise: (i = 0) => reduce ? {} : {
      initial: { opacity: 0, y: 16 }, animate: { opacity: 1, y: 0 },
      transition: { duration: .85, delay: .06 + i * .11, ease: EASE }
    },
    reveal: (i = 0) => reduce ? {} : {
      initial: { opacity: 0, y: 22 }, whileInView: { opacity: 1, y: 0 },
      viewport: { once: true, amount: .25 },
      transition: { duration: .7, delay: i * .08, ease: EASE }
    },
    press: reduce ? {} : { whileHover: { y: -1 }, whileTap: { scale: .985 } }
  };
}

   them stop. Subject and body are filled in the reader's own language, with
   three blank fields and the one instruction that matters, so sending is
   attaching a file and pressing send. encodeURIComponent, not escape: the
   body carries newlines and non-ASCII in two of the three languages. */
const mailto = t =>
  `mailto:atlas@arvorealta.com?subject=${encodeURIComponent(t.mail.subject)}&body=${encodeURIComponent(t.mail.body)}`;

/* A rule that draws itself to its share of the largest figure in the set.
   There is no track behind it: a filled background track is a dashboard
   control, and what is being shown here is one length against another, not
   a progress reading. transformOrigin left so it grows from the figure's
   own edge, and scaleX so the browser animates on the compositor. Reduced
   motion draws it at full length with no transition. */
function Bar({ pct, max, on = "ink", cap = 100 }) {
  const reduce = useReducedMotion();
  const w = (pct / max) * cap;
  return html`<div class="mt-5 h-[3px] w-full origin-left" style=${{ maxWidth: `${w}%` }}>
    <${M.div}
      class="h-full w-full origin-left ${on === "bone" ? "bg-bone/70" : "bg-ink"}"
      initial=${reduce ? false : { scaleX: 0 }}
      whileInView=${{ scaleX: 1 }}
      viewport=${{ once: true, amount: .6 }}
      transition=${{ duration: .9, delay: .2, ease: EASE }}
      style=${{ scaleX: reduce ? 1 : undefined }} />
  </div>`;
}

/* Tracked capitals name a SECTION and nothing else. There are two on the
   page, and that is the whole allowance. A label that names a value next to
   it — a field, a date, a figure — is mono at 12px in sentence case, because
   it is found rather than read and it should not look like a section opening.
   Thirteen strings wore the eyebrow costume for a while and the page had one
   texture for everything that was not a sentence.

   Both carry --ink at 75%, which measures 4.89:1 on paper and 5.55:1 on the
   paper-3 cards. They sat at 55% for a while, which is 2.97:1, and every
   label, caption and file-meta line on the page was under the 4.5:1 small
   text needs. The muting is the point; failing the floor was not. */
function Eyebrow({ children, on = "flat" }) {
  /* Full bone on the photograph, never a muted one. This line sits in the
     band where the picture's highlights run, measured at 3.49:1 to 5.03:1
     against its own ground, and taking 25% off the type is the difference
     between clearing the floor and not. Only the strongest value crosses
     onto a picture; on the flat grounds the mark can be muted because the
     ground underneath it is a single known value. */
  const tone = on === "photo" ? "text-bone"
             : on === "inv"   ? "text-bone/75"   /* the mark is 2.03:1 on ink and barred; 6.76:1 here */
             : "text-brick";
  return html`<p class="font-mono text-[11px] uppercase tracking-[.18em] ${tone}">${children}</p>`;
}

function Action({ href, children, tone = "solid", class: extra = "", ...rest }) {
  const mo = useMo();
  const base = "inline-flex items-center justify-center whitespace-nowrap rounded-full px-6 py-3 text-[15px] font-medium transition-colors";
  const tones = {
    solid: "bg-ink text-bone hover:bg-ink/90",
    ghost: "border border-ink/25 text-ink hover:border-ink/60"
  };
  const cls = `${base} ${tones[tone]} ${extra}`;
  /* A link when it goes somewhere and a button when it does something. The
     three language controls were the only clickable things on this page
     reporting cursor: default, measured, and an <a> with no href would be
     the same mistake with a worse name attached. */
  return href
    ? html`<${M.a} href=${href} class=${cls} ...${mo.press} ...${rest}>${children}<//>`
    : html`<${M.button} type="button" class=${cls} ...${mo.press} ...${rest}>${children}<//>`;
}

/* ------------------------------------------------------------- the intake
 *
 * The call to action used to open a prewritten mail. That is still the right
 * answer when there is nowhere to post to — an empty compose window asks the
 * reader to write the thing we are asking them for, which is where most of
 * them stop — but it has one hole the owner named: the reader has to
 * remember to attach the page, and a mail that arrives with nothing attached
 * is a round trip before the work can start. A form asks for the file while
 * the reader is still in the frame of mind to hand it over.
 *
 * WHAT THIS CANNOT DO ON ITS OWN. The site is static on GitHub Pages. There
 * is no server here, so there is nothing to receive a file: a form on this
 * page can validate, but it cannot deliver. INTAKE below is the address the
 * file would be posted to and it is null, because picking the service that
 * receives it is the owner's call and it needs a key. Until it is set the
 * dialog validates everything and then says plainly that nothing was sent,
 * which is the honest state rather than a fake success. The prewritten mail
 * stays in the footer of the dialog as the path that works today.
 *
 * THE CAP IS 10 MB AND IT IS CHECKED HERE. One page as a PDF is well under
 * a megabyte; a scan of one page is a few; ten is the headroom where a
 * phone photograph of a printed page still fits, and it is at or under what
 * the common form services accept on their free tiers. The check runs on the
 * file before any request, because a reader who finds out from a server that
 * their file was too large has already waited for the upload.
 *
 * A NATIVE <dialog>, NOT A DIV. showModal gives the focus trap, the inert
 * background, Escape to close and the ::backdrop for nothing, and all four
 * are things a hand-rolled modal gets wrong. Focus returns to the control
 * that opened it because the browser does that too.
 *
 * The file input is hidden and a real button clicks it. A file input styled
 * with sr-only is still focusable, so the focus ring lands on something
 * nobody can see; a button that forwards the click puts the ring where the
 * reader is looking. */
const MAX_MB = 10;
const MAX_BYTES = MAX_MB * 1024 * 1024;
const OK_EXT = ["pdf", "doc", "docx", "odt", "rtf", "png", "jpg", "jpeg", "webp"];
const ACCEPT = OK_EXT.map(e => "." + e).join(",") + ",application/pdf,image/*";
/* Basin, free tier: 50 submissions a month, 1 form, 100MB of storage, 30 day
   retention. The endpoint is not a secret and is not treated as one — a form
   action lives in the page's own HTML, so anybody reading source has it. What
   stands in for secrecy is Basin's own spam protection, which is why that is
   switched on at their end rather than guarded here. Storage is the binding
   limit rather than the submission count: 100MB against our own 10MB cap is
   ten worst cases, where a one page PDF is well under one. */
const INTAKE = "https://usebasin.com/f/945efcd39804";

const CtaCtx = createContext(() => {});

/* Every call to action on the page is this one control, so the label and the
   intent cannot drift apart between the nav, the hero, the ladder and the
   close. */
function CTA({ t, class: extra = "" }) {
  const open = useContext(CtaCtx);
  return html`<${Action} onClick=${open} class=${extra}>${t.cta}<//>`;
}

const sizeOf = n => n < 1048576
  ? Math.max(1, Math.round(n / 1024)) + " KB"
  : (n / 1048576).toFixed(1) + " MB";

function Intake({ t, open, onClose }) {
  const dlg = useRef(null);
  const picker = useRef(null);
  const mail = useRef(null);
  const [file, setFile] = useState(null);
  const [err, setErr] = useState("");
  const [state, setState] = useState("idle");

  useEffect(() => {
    const d = dlg.current;
    if (!d) return;
    if (open) {
      setFile(null); setErr(""); setState("idle");
      if (!d.open) d.showModal();
      /* Focus is moved by hand, not by an autofocus attribute. Measured:
         written as lowercase `autofocus` in the template React simply did not
         put it on the element, and showModal fell back to the first focusable
         thing in the dialog, which is the close button. Same class of bug as
         the hero video's missing `muted`, and the same fix: set it on the
         node. */
      if (mail.current) mail.current.focus();
    } else if (d.open) {
      d.close();
    }
  }, [open]);

  const pick = e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    if (!OK_EXT.includes(ext)) { setFile(null); setErr(t.form.errType); return }
    if (f.size > MAX_BYTES) { setFile(null); setErr(t.form.errSize); return }
    setErr(""); setFile(f);
  };

  const submit = async e => {
    e.preventDefault();
    const fd = new FormData(e.currentTarget);
    const email = String(fd.get("email") || "").trim();
    if (!email) return setErr(t.form.errEmail);
    /* Deliberately loose. The only thing worth rejecting here is an address
       that cannot be one; anything stricter turns away real addresses, and
       the real check is whether the reply arrives. */
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return setErr(t.form.errEmailBad);
    if (!file) return setErr(t.form.errFile);
    setErr(""); setState("sending");
    /* Kept deliberately. If the endpoint is ever unset the dialog says so
       rather than faking a success, which is the state this shipped in and
       the state it should fall back to rather than silently swallowing a
       file. */
    if (!INTAKE) { setState("done"); return }
    try {
      /* Accept: application/json or Basin answers a form post with a 302 to
         its own thank-you page. Through fetch that redirect is followed
         silently and `ok` reads true off Basin's HTML, so the dialog could
         not tell a delivered file from a rejected one. The header is what
         makes the reply a JSON status this can actually branch on. The
         Content-Type is deliberately not set: FormData writes its own, with
         the multipart boundary, and naming it by hand drops the boundary and
         the upload arrives empty. */
      const r = await fetch(INTAKE, {
        method: "POST",
        headers: { Accept: "application/json" },
        body: fd
      });
      if (!r.ok) throw new Error(String(r.status));
      setState("done");
    } catch (_) {
      setState("idle"); setErr(t.form.errSend);
    }
  };

  const field = "mt-2 w-full border border-ink/25 bg-paper px-4 py-3 text-[15px] text-ink placeholder:text-ink/40";
  const label = "font-mono text-[12px] leading-snug text-ink/75";

  return html`
    <dialog ref=${dlg} onClose=${onClose}
      onClick=${e => { if (e.target === dlg.current) onClose() }}
      aria-labelledby="intake-title"
      class="m-auto w-[min(34rem,calc(100vw-1.5rem))] border border-ink/20 bg-paper-3 p-0 text-ink backdrop:bg-ink/70">
      <div class="p-6 sm:p-9">
        <div class="flex items-start justify-between gap-6">
          <h2 id="intake-title" class="font-display text-[1.9rem] font-normal leading-tight tracking-[-.015em]">
            ${state === "done" ? t.form.doneTitle : t.form.title}
          </h2>
          <button type="button" onClick=${onClose} aria-label=${t.form.cancel}
            class="-m-2 shrink-0 p-2 font-mono text-[12px] text-ink/75 hover:text-ink">${t.form.cancel}</button>
        </div>

        ${state === "done" ? html`
          <p class="mt-6 leading-[1.7] text-ink/80">${t.form.doneBody}</p>
          ${!INTAKE && html`
            <p class="mt-5 border-l-2 border-ink/30 pl-4 font-mono text-[12px] leading-[1.6] text-ink/75">
              ${t.form.dry}
            </p>`}
        ` : html`
          <p class="mt-5 text-[.95rem] leading-[1.7] text-ink/80">${t.form.intro}</p>

          <form onSubmit=${submit} noValidate class="mt-7">
            <div>
              <label class="${label}" for="intake-email">${t.form.email}</label>
              <input ref=${mail} id="intake-email" name="email" type="email" autocomplete="email"
                inputmode="email" placeholder="name@company.com" class="${field}" />
              <p class="mt-2 font-mono text-[11px] leading-snug text-ink/75">${t.form.emailHint}</p>
            </div>

            <div class="mt-7">
              <p class="${label}">${t.form.file}</p>
              <input ref=${picker} name="page" type="file" accept=${ACCEPT} hidden onChange=${pick} />
              ${file ? html`
                <div class="mt-2 flex flex-wrap items-center justify-between gap-x-5 gap-y-3 border border-ink/25 bg-paper px-4 py-3">
                  <span class="min-w-0 break-all text-[15px]">${file.name}</span>
                  <span class="flex shrink-0 items-center gap-4 font-mono text-[12px] text-ink/75">
                    <span class="tabular-nums">${sizeOf(file.size)}</span>
                    <button type="button" class="underline underline-offset-4 hover:text-ink"
                      onClick=${() => { setFile(null); if (picker.current) picker.current.value = "" }}>${t.form.remove}</button>
                  </span>
                </div>`
              : html`
                <button type="button" onClick=${() => picker.current && picker.current.click()}
                  class="mt-2 w-full border border-dashed border-ink/35 bg-paper px-4 py-5 text-[15px] text-ink/80 hover:border-ink/60 hover:text-ink">
                  ${t.form.choose}
                </button>`}
              <p class="mt-2 font-mono text-[11px] leading-snug text-ink/75">${t.form.fileHint}</p>
            </div>

            <!-- One error line, under the fields and above the action, so it
                 is between the thing that is wrong and the button that was
                 just pressed. aria-live, because a reader who cannot see it
                 appear is otherwise told nothing at all. -->
            <p aria-live="polite" class="min-h-[1.5rem] pt-5 text-[.9rem] leading-snug text-brick">${err}</p>

            <div class="mt-2 flex flex-wrap items-center gap-x-6 gap-y-4">
              <${Action} type="submit" disabled=${state === "sending"}>
                ${state === "sending" ? t.form.sending : t.form.send}
              <//>
              <!-- The prewritten mail stays, as the path that works with no
                   server behind the form. -->
              <a href=${mailto(t)} class="font-mono text-[12px] text-ink/75 underline underline-offset-4 hover:text-ink">
                atlas@arvorealta.com
              </a>
            </div>
          </form>
        `}
      </div>
    </dialog>`;
}

/* The language control is three letters rather than a dropdown. There are
   exactly three, a select would hide two of them behind a tap, and the
   current one has to be readable at a glance by someone who cannot read the
   other two. aria-pressed carries the state for anyone not seeing the fill. */
function LangPick({ lang, setLang, t, onPhoto }) {
  return html`
    <div class="flex items-center rounded-full border p-[3px] ${onPhoto ? "border-bone/35" : "border-ink/20"}"
         role="group" aria-label=${t.langLabel}>
      ${LANGS.map(code => html`
        <button key=${code} type="button" onClick=${() => setLang(code)}
          aria-pressed=${lang === code} lang=${STR[code].htmlLang}
          title=${STR[code].label}
          class="rounded-full px-2.5 py-1 font-mono text-[11px] uppercase tracking-[.1em] transition-colors ${
            lang === code
              ? (onPhoto ? "bg-bone text-ink" : "bg-ink text-bone")
              : (onPhoto ? "text-bone/70 hover:text-bone" : "text-ink/75 hover:text-ink")}">
          ${STR[code].short}
        </button>`)}
    </div>`;
}

function Nav({ t, lang, setLang, onPhoto }) {
  const links = [[t.nav.open, "#open"], [t.nav.case, "#case"], [t.nav.price, "#price"]];
  const shell = onPhoto
    ? "on-ink border-transparent bg-transparent text-bone"
    : "border-ink/10 bg-paper/85 backdrop-blur-md";
  return html`
    <!-- Fixed, not sticky. A sticky header stays in normal flow, so it was
         holding 68px of its own above the band and showing the page's ground
         there: the bar read as a solid strip however transparent its own
         background was. Fixed takes it out of flow and the photograph starts
         at the top of the screen. -->
    <header class="fixed inset-x-0 top-0 z-40 border-b transition-colors ${shell}">
      <div class="${WRAP} flex h-[68px] items-center justify-between gap-5">
        <a href="#top" class="-my-1 py-1 font-mono text-[13px] uppercase tracking-[.22em]">Arvorealta</a>
        <nav class="hidden items-center gap-7 lg:flex">
          ${links.map(([l, h]) => html`
            <a key=${h} href=${h}
               class="-my-1 py-1 text-[14px] transition-colors ${onPhoto
                 ? "text-bone/75 hover:text-bone"
                 : "text-ink/75 hover:text-ink"}">${l}</a>`)}
        </nav>
        <div class="flex items-center gap-2.5">
          <${LangPick} lang=${lang} setLang=${setLang} t=${t} onPhoto=${onPhoto} />
          <span class="hidden sm:block">
            <${CTA} t=${t} class=${onPhoto ? "!bg-bone !text-ink hover:!bg-bone/90" : ""} />
          </span>
        </div>
      </div>
    </header>`;
}

/* The photograph holds the frame and the video arrives over it.
   `preload="metadata"` rather than `auto`, so the 3.1 MB does not compete
   with the stylesheet and the fonts for the first paint; the picture under it
   is already decoded by then and the band is never empty. The handoff waits
   for `canplaythrough` rather than `canplay`, because `canplay` fires with a
   few frames buffered and a ten second loop that stalls two seconds in looks
   worse than no video at all. It fades rather than cuts, so a reader who
   never notices the swap is the success case.

   Under `prefers-reduced-motion` the element is never rendered at all. A
   `<video autoplay>` cannot be stopped from CSS, so the only honest way to
   respect the setting is not to mount it, and that reader keeps the
   photograph. Same for the failure path: `onError` drops it and the picture
   is already there.

   muted and playsinline are not optional. Without both, iOS refuses to
   autoplay and shows a play button over the hero. */
function Hero({ t }) {
  const mo = useMo();
  const reduce = useReducedMotion();
  const [ready, setReady] = useState(false);
  const [failed, setFailed] = useState(false);
  return html`
    <section id="top" class="on-ink relative isolate overflow-clip bg-ink text-bone">
      <picture class="absolute inset-0 block">
        <!-- The source file is 1141 x 640, so there is no 1920 or 2560 here:
             a wider file would be upscaled bytes pretending to be detail. The
             picture is soft above about 1200px and wants regenerating larger. -->
        <source type="image/webp" sizes="100vw"
          srcset="/assets/img/after-1-760.webp 760w, /assets/img/after-1-960.webp 960w, /assets/img/after-1-1141.webp 1141w" />
        <img src="/assets/img/after-1-1141.jpg" sizes="100vw"
          srcset="/assets/img/after-1-760.jpg 760w, /assets/img/after-1-960.jpg 960w, /assets/img/after-1-1141.jpg 1141w"
          width="1141" height="640" alt="" fetchpriority="high" decoding="async"
          class="size-full object-cover object-[62%_46%] [opacity:var(--hero-photo)]" />
      </picture>
      ${!reduce && !failed && html`
        <video
          class="absolute inset-0 size-full object-cover object-[62%_46%] transition-opacity duration-700
                 ${ready ? "opacity-100" : "opacity-0"}"
          src="/assets/video/hero-1-720.mp4"
          poster="/assets/img/after-1-1141.jpg"
          width="1280" height="720"
          autoPlay muted loop playsInline preload="metadata"
          aria-hidden="true" tabIndex="-1"
          ref=${el => {
            /* React writes `muted` as a property and skips it often enough on
               first render that the attribute is simply absent, and a video
               that is not muted is a video no browser will autoplay. The same
               goes for playsInline, which iOS reads to decide whether to take
               the hero fullscreen instead. Setting all three on the node is
               the only way to be sure, and play() is called because autoplay
               alone does not restart a video React has just re-mounted.
               The rejection is swallowed: a blocked autoplay leaves the
               photograph in place, which is the fallback either way. */
            if (!el) return;
            el.muted = true; el.defaultMuted = true;
            el.playsInline = true; el.autoplay = true;
            const go = el.play();
            if (go && go.catch) go.catch(() => {});
          }}
          onCanPlayThrough=${() => setReady(true)}
          onError=${() => setFailed(true)} />`}
      <!-- The band is the screen. The header floats on it rather than sitting
           above it, so the hero takes the whole viewport rather than the
           viewport minus a bar. dvh, not vh, so the iOS address bar does not
           push the action off the bottom. -->
      <!-- 100dvh alone is a trap on a short, wide window. On a 440px-tall
           viewport the band is 440px and the 192px of padding leaves 248px
           for four objects, which is the squashed look. The floor keeps the
           band usable and lets the page scroll instead, and the padding
           shrinks with the viewport rather than holding 96px a side at every
           height. Tall screens are unaffected: there the max is 100dvh. -->
      <div class="${WRAP} relative grid min-h-[max(34rem,100dvh)] content-center py-[clamp(4rem,9vh,6rem)]">
        <div>
          <${M.div} ...${mo.rise(0)}><${Eyebrow} on="photo">${t.hero.eyebrow}<//><//>
          <${M.h1} ...${mo.rise(1)}
            class="mt-7 font-display text-[clamp(2.7rem,1rem+5vw,5.2rem)] font-normal leading-[1.02] tracking-[-.02em]">
            ${t.hero.h1a}<br /> ${t.hero.h1b}
          <//>
          <${M.p} ...${mo.rise(2)}
            class="mt-8 max-w-[44ch] text-[clamp(1.05rem,.98rem+.35vw,1.25rem)] leading-[1.6] text-bone/80">
            ${t.hero.sub}
          <//>
          <${M.div} ...${mo.rise(3)} class="mt-10 flex flex-wrap items-center gap-3">
            <${CTA} t=${t} class="!bg-bone !text-ink hover:!bg-bone/90" />
            <${Action} href="#open" tone="ghost" class="!border-bone/30 !text-bone hover:!border-bone/70">${t.hero.second}<//>
          <//>
        </div>
      </div>
    </section>`;
}

function Gate({ t }) {
  const mo = useMo();
  return html`
    <section class="${WRAP} border-b border-ink/10 py-14">
      <div class="grid gap-10 md:grid-cols-2 md:gap-16">
        ${t.gate.map(([k, v], i) => html`
          <${M.div} key=${k} ...${mo.reveal(i)}>
            <p class="font-mono text-[12px] leading-snug text-ink/75">${k}</p>
            <p class="mt-3 max-w-[44ch] text-[1.05rem] leading-[1.65]">${v}</p>
          <//>`)}
      </div>
    </section>`;
}

function OpenTender({ t }) {
  const mo = useMo();
  return html`
    <section id="open" class="${ANCHOR} ${WRAP} py-20 sm:py-28">
      <${M.div} ...${mo.reveal(0)}>
        <${Eyebrow}>${t.open.eyebrow}<//>
        <h2 class="mt-6 max-w-[20ch] font-display text-[clamp(2.1rem,1.3rem+2.6vw,3.6rem)] font-normal leading-[1.06] tracking-[-.015em]">
          ${t.open.h2}
        </h2>
      <//>
      <${M.div} ...${mo.reveal(1)}
        class="mt-12 grid overflow-hidden rounded-2xl border border-ink/15 bg-paper-3 lg:grid-cols-[1.15fr_1fr]">
        <div class="border-b border-ink/12 p-8 sm:p-10 lg:border-b-0 lg:border-r">
          <!-- The heading is in the reader's language. The Norwegian original
               is still here, because a bidder has to match it against the
               documents in front of them, but it sits on its own line under a
               label that says what it is. A quotation from another document
               reads as deliberate; the same words loose inside an English
               sentence read as a half-finished translation, which is what
               this was. -->
          <h3 class="text-[1.5rem] font-medium leading-tight tracking-[-.02em]">${t.open.title}</h3>
          ${t.open.official && html`
            <div class="mt-4">
              <p class="font-mono text-[12px] leading-snug text-ink/75">${t.open.official}</p>
              <p lang="nb" class="mt-1.5 text-[1.05rem] leading-snug">Leveranse av avfallsbeholdere</p>
            </div>`}
          <p class="mt-3 text-[.95rem] leading-relaxed text-ink/75">${t.open.buyer}</p>
          <p class="mt-7 max-w-[46ch] leading-[1.7]">${t.open.body}</p>

          <div class="mt-8 flex flex-wrap gap-3">
            <${Action} href="/assets/vedlegg-5/Vedlegg-5-eksempel.pdf" tone="ghost" target="_blank" rel="noopener">${t.open.seeEx}<//>
            <${Action} href="/assets/vedlegg-5/Vedlegg-5-Utfyllende-opplysninger.docx" download>${t.open.getTpl}<//>
          </div>
          <p class="mt-4 text-[.85rem] leading-relaxed text-ink/75">
            ${t.open.exMeta} · ${t.open.tplMeta}
          </p>
        </div>
        <dl class="grid content-center gap-8 p-8 sm:p-10">
          ${t.open.fields.map(([k, v]) => html`
            <div key=${k}>
              <dd class="font-mono text-[1.6rem] leading-none tracking-[-.02em]">${v}</dd>
              <dt class="mt-3 font-mono text-[12px] leading-snug text-ink/75">${k}</dt>
            </div>`)}
        </dl>
      <//>
      <${M.p} ...${mo.reveal(2)} class="mt-8 max-w-[58ch] text-[.95rem] leading-[1.7] text-ink/75">
        ${t.open.foot}
      <//>
    </section>`;
}

/* The award as one horizontal bar, measured rather than asserted.
 *
 * The waffle that stood here could be counted, which a bar cannot, and that
 * was its whole advantage. What it cost was the fold: a hundred cells is a
 * texture, and a texture reads as decoration before it reads as a score. A
 * bar is one object at full measure and the 65 / 35 split is a single break
 * in it, which is the argument. So the bar comes back, and the counting is
 * replaced by three things the first bar did not have.
 *
 * ONE. The 65 is drawn, not inferred. A bracket spans the first two segments
 * and carries "65 / 100" over it. The headline says most of the score is not
 * the price; the bracket is that sentence as a graphic, and it needs no
 * translating, which is why it is a figure and not a phrase.
 *
 * TWO. The figures sit inside the segments, so there is no legend to hop to.
 * Measured on ink the three fills read 9.85:1, 6.12:1 and 3.88:1, all clear
 * of the 3:1 a graphic mark needs. Ink type on those same fills reads the
 * same three figures, and the numerals are display size, where the floor is
 * 3:1 rather than 4.5:1. The names stay outside on the ink ground at 8.19:1
 * and 5.50:1 — words are small text and small text does not go on the
 * geometry. That split is the rule the first bar established and it holds.
 *
 * THREE. The fills separate properly. On the first bar the two non-price
 * fills had to sit almost on top of each other so the 65 would read as one
 * mass, which left them nearly indistinguishable from one another. The
 * bracket does the grouping now, so the three can descend in clear steps and
 * still group. That is the waffle's one real gain, kept without its cost.
 *
 * The motion is a single sweep, and it is a curtain rather than three fills.
 * Three segments each growing from their own left edge animate as three
 * events; one block of the page's own ink ground sliding right off the whole
 * bar is one event at one constant speed, and the segment geometry is never
 * distorted while it runs. It also sidesteps the trap this file records
 * twice: an element that starts outside its own box is never seen by the
 * observer watching it. The curtain starts covering the bar, so it is always
 * in view, and the state still lives on the container above it. Each name
 * fades in as the sweep passes its segment, and the bracket draws last,
 * after the bar it measures is complete.
 *
 * Because nothing in the bar is animated by Motion, the hover dim can be a
 * plain class on the segment. On the waffle it could not: Motion writes
 * opacity inline while it animates and that beats any class on the same
 * node, which was measured as a hundred cells sitting at opacity 1 with a
 * block hovered.
 *
 * Accessibility. The bar is aria-hidden and a sentence carries the same
 * content, because a chart is not reading matter. Identity is never colour
 * alone: every segment holds its own figure and sits over its own name. The
 * isolation works by keyboard as well as by mouse.
 */
function Weighting({ t }) {
  const mo = useMo();
  const reduce = useReducedMotion();
  const [lit, setLit] = useState(null);

  const segs = t.weigh.segs;
  const tone = ["bg-bone/95", "bg-bone/70", "bg-bone/50"];
  const name = ["text-bone/85", "text-bone/85", "text-bone/65"];

  /* The bracket, the bar and the names are three rows of one grid, so the
     65 boundary lands in the same place in all three to the pixel. Track
     widths come from the data rather than from a hand-written template, and
     every one is minmax(0, Nfr) rather than Nfr: an fr track takes its
     min-content width as a floor, so at 375 the longest name pushed its own
     column 13px wider than the segment above it and the three rows stopped
     lining up. Measured, not reasoned about. */
  const cols = { gridTemplateColumns: segs.map(([, p]) => "minmax(0," + p + "fr)").join(" ") };
  const total = segs.reduce((n, [, p]) => n + p, 0);
  const group = segs[0][1] + segs[1][1];

  /* Where the sweep is when it passes each segment's left edge, as a
     fraction of the sweep's own duration. The names follow it. */
  const SWEEP = 1.05;
  let run = 0;
  const starts = segs.map(([, p]) => { const s = run; run += p; return s / total; });

  const dim = g => lit !== null && lit !== g ? "opacity-25" : "opacity-100";
  const hold = g => ({
    onMouseEnter: () => setLit(g), onMouseLeave: () => setLit(null),
    onFocus: () => setLit(g), onBlur: () => setLit(null)
  });

  return html`
    <section id="case" class="on-ink ${ANCHOR} bg-ink py-20 text-bone sm:py-28">
      <div class="${WRAP}">
        <${M.div} ...${mo.reveal(0)}>
          <${Eyebrow} on="inv">${t.weigh.eyebrow}<//>
          <h2 class="mt-6 max-w-[20ch] font-display text-[clamp(2.1rem,1.3rem+2.6vw,3.6rem)] font-normal leading-[1.06] tracking-[-.015em]">
            ${t.weigh.h2}
          </h2>
        <//>

        <${M.div} class="mt-14 sm:mt-16"
          initial=${reduce ? false : "out"} whileInView="in"
          viewport=${{ once: true, amount: .35 }}>

          <p class="sr-only">${t.weigh.alt}</p>

          <div aria-hidden="true">
            <!-- A dimension line, not a bracket, and the difference is the
                 whole point. A bracket groups; a dimension line states a
                 measurement, which is the language a firm whose product is
                 technical documents already speaks. End ticks, a hairline
                 broken for the figure, and the figure itself at display size
                 so the one number a reader carries away is legible rather
                 than a caption. The first version set it as a 10px bordered
                 box with an 11px label and read as a stray rule.

                 It spans the first two segments and it is drawn last, because
                 a measurement that arrives before the thing it measures is a
                 claim again. -->
            <${M.div} class="grid gap-[2px]" style=${cols}
              variants=${{
                out: { opacity: 0, y: 8 },
                in: { opacity: 1, y: 0, transition: { duration: .55, delay: SWEEP * (group / total) + .12, ease: EASE } }
              }}>
              <div class="col-span-2 flex items-center">
                <div class="h-3.5 w-px shrink-0 bg-bone/50"></div>
                <div class="h-px flex-1 bg-bone/50"></div>
                <div class="flex shrink-0 items-baseline gap-2 px-3 sm:px-6">
                  <span class="font-display text-[clamp(1.5rem,1.1rem+1.1vw,2rem)] leading-none text-bone tabular-nums">${group}</span>
                  <span class="font-mono text-[11px] leading-none tracking-[.04em] text-bone/60 tabular-nums">/ ${total}</span>
                </div>
                <div class="h-px flex-1 bg-bone/50"></div>
                <div class="h-3.5 w-px shrink-0 bg-bone/50"></div>
              </div>
            <//>

            <!-- The bar takes the open-tender card's corner, rounded-2xl,
                 and so do the price cards. It went from pill ends to square
                 ends to this: the pill was a dashboard control and the square
                 was the only hard corner on a page whose every other surface
                 is a 16px card, which made it read as unfinished rather than
                 as precise. One radius across the page is a system; three are
                 three decisions.

                 The radius lives on the wrapper, not on the segments, so the
                 bar is one rounded surface with 2px of the page's own ink
                 ground cut through it rather than three rounded tiles. The
                 wrapper was already clipping, because the curtain travels a
                 full bar width to the right and an unclipped one would take
                 the page with it, so the rounding costs nothing. -->
            <div class="relative mt-3.5 overflow-hidden rounded-2xl">
              <div class="grid gap-[2px]" style=${cols}>
                ${segs.map(([label, pct], g) => html`
                  <div key=${label} ...${hold(g)}
                    class="flex h-20 items-center px-5 transition-opacity duration-300 sm:h-24 sm:px-7
                           ${tone[g]} ${dim(g)}">
                    <span class="font-display text-[clamp(1.7rem,1.15rem+1.7vw,2.5rem)] leading-none tracking-[-.01em] text-ink tabular-nums">
                      ${pct}
                    </span>
                  </div>`)}
              </div>
              ${!reduce && html`
                <${M.div} class="absolute inset-0 bg-ink"
                  variants=${{
                    out: { x: "0%" },
                    in: { x: "101%", transition: { duration: SWEEP, ease: EASE } }
                  }} />`}
            </div>

            <!-- The names sit under their own segments on the ink ground,
                 where a word reads at 8.19:1 and 5.50:1. Each one arrives as
                 the sweep uncovers the segment it belongs to. They take the
                 segment's own horizontal padding from sm up, so a name sits
                 directly under the figure it names rather than under the
                 segment's edge — the pair is one object and the corner is
                 not. On a phone they run near flush instead: the first
                 segment is 99px wide there, and 28px of matching inset left
                 59px of measure, which broke "Climate and environment" over
                 three lines. The 8px of misalignment costs less than that. -->
            <div class="mt-4 grid gap-[2px]" style=${cols}>
              <!-- Two elements again, and for the reason this file records:
                   Motion writes opacity inline while it animates the arrival,
                   and an inline opacity beats any class on the same node. The
                   first version of this row carried the dim as a class on the
                   motion div and was measured doing nothing at all — three
                   names at opacity 1 with a segment hovered. The outer div
                   owns the dim and the interaction, the inner one owns the
                   arrival, and the two multiply. -->
              ${segs.map(([label], g) => html`
                <div key=${label} ...${hold(g)} tabindex="0"
                  class="px-1 transition-opacity duration-300 sm:px-7 ${dim(g)}">
                  <${M.div} custom=${g}
                    variants=${{
                      out: { opacity: 0 },
                      in: i => ({ opacity: 1, transition: { duration: .45, delay: SWEEP * starts[i] + .18, ease: EASE } })
                    }}
                    class="font-mono text-[11px] leading-snug sm:text-[12px] ${name[g]}">
                    ${label}
                  <//>
                </div>`)}
            </div>
          </div>
        <//>

        <!-- The sourcing note sits under the bar, on the same left edge as
             the headline and the first segment. It spent a version opposite
             the headline as a spread, which read as a standfirst; it is not
             one. It says where the three figures come from, so it belongs
             under the three figures, where a caption goes. -->
        <${M.p} ...${mo.reveal(2)} class="mt-12 max-w-[62ch] text-[.95rem] leading-[1.7] text-bone/75">
          ${t.weigh.body}
        <//>
      </div>
    </section>`;
}

/* The ladder, restored.
 *
 * This fold stood as four rungs separated by hairlines — Free, 600, 2,400,
 * 8,000 — each tier a sentence. The owner asked for the earlier one back and
 * said it was better, and it is: that version carried the deliverables as a
 * list under each price, and a reader comparing three tiers is scanning for
 * what they get rather than reading a paragraph about it. One line had gone
 * missing in the compression and is back with it — "The index. Every
 * project, by client and year, ready at the next bid."
 *
 * The house file's objection to cards is that equal columns say "pick one of
 * these four", which is the opposite of a ladder. These are not equal: the
 * middle column runs 1.25 against 1, and it lifts four pixels out of the row
 * and carries the only solid border, so the recommended rung is argued for
 * rather than merely marked. The shape still carries the argument before a
 * word is read, which is the thing the rule was protecting.
 *
 * Three tiers, not four. The free step is the mouth of the funnel and it is
 * not a tier — it was never in this ladder, it lives in the hero and the
 * close, and the line under the row carries it here with the page's one
 * action beside it.
 *
 * The earlier fold's 16px radius is back, because it is the open-tender
 * card's radius and that card is the page's surface. All three cards take
 * the same ground as well — paper-3, a hairline at ink/15 — so the
 * recommended rung is argued by the wider column, the 16px lift and a solid
 * ink border rather than by being the only card with a ground. The page's
 * own label conventions rather than the original's tracked capitals.
 * Everything else is the earlier fold: the widths, the lift, the lists, and
 * the comparison under the row.
 *
 * Every price, every deliverable and the 15,000 kr come off
 * reference/index.html. Do not round one and do not invent one. */
function Ladder({ t }) {
  const mo = useMo();
  return html`
    <section id="price" class="${ANCHOR} ${WRAP} py-20 sm:py-28">
      <${M.div} ...${mo.reveal(0)} class="max-w-[46ch]">
        <${Eyebrow}>${t.ladder.eyebrow}<//>
        <h2 class="mt-6 font-display text-[clamp(2.1rem,1.3rem+2.6vw,3.6rem)] font-normal leading-[1.06] tracking-[-.015em]">${t.ladder.h2}</h2>
        <p class="mt-7 leading-[1.7] text-ink/80">${t.ladder.lede}</p>
      <//>

      <!-- One column on a phone, three from lg, and nothing scrolls sideways
           at any width. The middle column is the wider one and it lifts out
           of the row, so the recommended tier is the shape of the row rather
           than a badge stuck on a card. -->
      <div class="mt-14 grid gap-6 lg:grid-cols-[1fr_1.25fr_1fr] lg:items-start">
        ${t.ladder.tiers.map((x, i) => html`
          <${M.div} key=${x.name} ...${mo.reveal(i * .6)}
            class="flex h-full flex-col rounded-2xl border bg-paper-3 p-7 sm:p-9 ${x.lead
              ? "border-ink lg:-mt-4 lg:pb-11"
              : "border-ink/15"}">
            <p class="font-mono text-[12px] leading-snug text-ink/75">${x.step}</p>
            <h3 class="mt-4 text-[1.3rem] font-medium leading-tight tracking-[-.02em]">${x.name}</h3>
            <p class="mt-6 flex flex-wrap items-baseline gap-x-4">
              <b class="font-display text-[clamp(2.3rem,1.8rem+1.4vw,3.2rem)] font-normal leading-none tracking-[-.01em] tabular-nums">${x.price}</b>
              <em class="font-mono text-[12px] not-italic leading-snug text-ink/75">${x.time}</em>
            </p>
            <p class="mt-6 text-[.95rem] leading-[1.65] text-ink/80">${x.terms}</p>
            <!-- The deliverables, one to a row with a hairline above each, so
                 the list is countable at a glance. This is the part the
                 compressed version lost and the reason the owner wanted the
                 earlier fold back. -->
            <ul class="mt-6 grid gap-3 text-[.95rem] leading-[1.55]">
              ${x.points.map(pt => html`
                <li key=${pt} class="border-t border-ink/15 pt-3">${pt}</li>`)}
            </ul>
            <!-- mt-auto pins the credit line to the foot of every card, so
                 the three read across at the same height however many
                 deliverables each one carries. The credit is not a footnote,
                 it is the mechanic. -->
            <p class="mt-auto pt-7 font-mono text-[12px] leading-[1.5] text-ink/75">${x.note}</p>
          <//>`)}
      </div>

      <!-- The free step is not a tier and never was one in this fold. It gets
           the line and the action under the row instead, so the page's one
           CTA is still in front of a reader who came here for the price. -->
      <${M.div} ...${mo.reveal(1)} class="mt-12 flex flex-wrap items-center gap-x-8 gap-y-5">
        <p class="text-[.95rem] leading-[1.7] text-ink/80">${t.ladder.free}</p>
        <${CTA} t=${t} />
      <//>

      <${M.p} ...${mo.reveal(2)} class="mt-10 max-w-[62ch] text-[.95rem] leading-[1.7] text-ink/75">
        ${t.ladder.foot}
      <//>
    </section>`;
}

function Close({ t }) {
  const mo = useMo();
  return html`
    <section class="${WRAP} py-24 sm:py-32">
      <${M.div} ...${mo.reveal(0)} class="max-w-[52ch]">
        <${Eyebrow}>${t.close.eyebrow}<//>
        <h2 class="mt-6 font-display text-[clamp(2.1rem,1.3rem+2.6vw,3.6rem)] font-normal leading-[1.06] tracking-[-.015em]">${t.close.h2}</h2>
        <p class="mt-7 leading-[1.7] text-ink/80">${t.close.body}</p>
        <div class="mt-10"><${CTA} t=${t} /></div>
      <//>
    </section>
    <footer class="border-t border-ink/10 py-10">
      <div class="${WRAP} flex flex-wrap items-center justify-between gap-4 font-mono text-[11px] uppercase tracking-[.18em] text-ink/75">
        <span>Arvorealta</span>
        <a href="mailto:atlas@arvorealta.com" class="-my-1.5 py-1.5 transition-colors hover:text-ink">atlas@arvorealta.com</a>
      </div>
    </footer>`;
}

function App() {
  /* The browser's own preference decides the first language, so a Norwegian
     or Finnish reader arriving cold gets their own. English is the fallback
     and the default everywhere else. A choice, once made, is remembered and
     outranks the browser from then on. */
  const [lang, setLang] = useState(() => {
    try { const s = localStorage.getItem("ar-lang"); if (s && STR[s]) return s } catch (e) {}
    const want = (navigator.languages || [navigator.language || "en"]).map(l => String(l).toLowerCase());
    for (const l of want) {
      if (l.startsWith("nb") || l.startsWith("nn") || l.startsWith("no")) return "nb";
      if (l.startsWith("fi")) return "fi";
      if (l.startsWith("en")) return "en";
    }
    return "en";
  });

  useEffect(() => {
    document.documentElement.lang = STR[lang].htmlLang;
    try { localStorage.setItem("ar-lang", lang) } catch (e) {}
  }, [lang]);

  const [onPhoto, setOnPhoto] = useState(true);
  useEffect(() => {
    /* The band itself is the sentinel. A 1px marker at its top sits above
       the header's own 68px, so with that margin it never intersects and the
       bar claimed it was past the photograph while sitting on it. Watching
       the whole band asks the right question: is any part of the picture
       still under the bar. */
    const el = document.getElementById("top");
    if (!el || !("IntersectionObserver" in window)) return;
    const io = new IntersectionObserver(([e]) => setOnPhoto(e.isIntersecting),
      { rootMargin: "-68px 0px 0px 0px", threshold: 0 });
    io.observe(el);
    return () => io.disconnect();
  }, []);

  const t = STR[lang];

  /* The intake dialog is mounted once, at the root, and every call to action
     on the page opens this one. Four copies of a <dialog> would be four
     copies of the reader's half-filled form, and whichever one they opened
     second would be empty. The opener travels down as context rather than as
     a prop through five components that have no other reason to know about
     it. */
  const [intake, setIntake] = useState(false);

  return html`
    <${CtaCtx.Provider} value=${() => setIntake(true)}>
      <!-- Measured on the live page: the first Tab lands on the wordmark and
           it takes eight stops to reach the hero's own action. This is the
           first focusable thing in the document and it is invisible until it
           has focus, which is the whole pattern. -->
      <a href="#main"
         class="sr-only focus-visible:not-sr-only focus-visible:fixed focus-visible:left-4 focus-visible:top-4
                focus-visible:z-50 focus-visible:rounded-full focus-visible:bg-ink focus-visible:px-5
                focus-visible:py-3 focus-visible:text-[15px] focus-visible:text-bone">
        ${t.skip}
      </a>
      <${Nav} t=${t} lang=${lang} setLang=${setLang} onPhoto=${onPhoto} />
      <main id="main" tabindex="-1">
        <${Hero} t=${t} />
        <${Gate} t=${t} />
        <${OpenTender} t=${t} />
        <${Weighting} t=${t} />
        <${Ladder} t=${t} />
        <${Close} t=${t} />
      </main>
      <${Intake} t=${t} open=${intake} onClose=${() => setIntake(false)} />
    <//>`;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
