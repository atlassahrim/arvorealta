<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arvorealta</title>
<!-- GitHub Pages serves static files and cannot issue a 301, so this page is
     the redirect. The meta refresh is what a crawler reads; the script runs
     first in a browser and uses replace() so the back button does not land
     the reader here again. rel=canonical tells a search engine the target is
     the real page, which is the closest a static host gets to a 301. -->
<meta http-equiv="refresh" content="0; url=/">
<link rel="canonical" href="https://arvorealta.com/">
<meta name="robots" content="noindex, follow">
<script>location.replace("/" + location.search + location.hash)</script>
<style>
  body { margin:0; min-height:100dvh; display:grid; place-items:center;
         background:#fff; color:#111;
         font:400 16px/1.75 ui-sans-serif, system-ui, sans-serif }
  a { color:inherit }
</style>
</head>
<body>
  <p>Redirecting to <a href="/">arvorealta.com</a>.</p>
</body>
</html>
