<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arvorealta · Document standards for public tenders</title>
<meta name="description" content="Public buyers score the documents you hand in. Document standards for industrial manufacturers bidding into Nordic public tenders.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#D9D7D4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11261F" media="(prefers-color-scheme: dark)">

<!-- Self-hosted. The skill bans a Google Fonts <link> in production and this
     repo has no build step to self-host through, so the four woff2 files were
     pulled once and committed. 100K in total, no third-party request for type,
     and nothing outside this repo can change what the page renders in. -->
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/geist-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/geist-mono-latin.woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts/geist.css">

<link rel="stylesheet" href="/lab/strict/tw.css">

<script>
  (function () {
    var s = null;
    try { s = localStorage.getItem("ar-theme") } catch (e) {}
    var d = s || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", d);
  })();
</script>
</head>

<body class="font-sans antialiased bg-paper text-ink dark:bg-ink-2 dark:text-bone">

<div id="root">
  <!-- Static fallback. The page renders through React from a CDN module, and
       a module that fails to load would otherwise leave an empty document.
       createRoot clears this the moment React is up; if it never is, the
       reader still gets the offer, the terms and a working address. -->
  <noscript style="display:block;padding:4rem 1.25rem;max-width:46rem;margin:0 auto">
    <h1 style="font-size:2.5rem;line-height:1.05;margin:0 0 1.5rem">Nobody told you which page cost you the contract.</h1>
    <p style="margin:0 0 1.5rem;line-height:1.6">Public buyers score the documents you hand in. Not the plant, not the price list, not the twenty years.</p>
    <p style="margin:0"><a href="mailto:atlas@arvorealta.com">Get your page scored</a>. Send one page from a tender you lost. No charge and no call.</p>
  </noscript>
</div>

<script type="module">
/* React 19, react-dom, Motion and htm, bundled once with esbuild and
   committed as one file. No CDN at run time: a published page should not
   depend on a third party staying up, and vendoring is also the only way a
   no-build repo gets a single React instance. Rebuild with the command in
   assets/vendor/README.md. */
import { React, createRoot, motion, useReducedMotion, htm } from "/assets/vendor/runtime.js";
const { useState, useEffect, useCallback } = React;

const html = htm.bind(React.createElement);
const M = motion;

/* ---------------------------------------------------------------- motion
   MOTION_INTENSITY is 6, and the skill's rule is that every animation can be
   justified in one sentence. Three are used and nothing else moves.

   rise      the hero's objects arrive in reading order, which states the
             hierarchy before a word of it has been read
   reveal    a section enters once as it is scrolled to, so the page is
             paced by the reader rather than delivered all at once
   press     a control that moves under the pointer reads as a thing rather
             than as text

   Every one collapses to nothing under prefers-reduced-motion, through
   useReducedMotion rather than through a media query, so the degradation is
   in the same place as the animation. Nothing loops. Nothing hijacks scroll. */
const EASE = [0.16, 1, 0.3, 1];

function useMo() {
  const reduce = useReducedMotion();
  return {
    rise: (i = 0) => reduce ? {} : {
      initial: { opacity: 0, y: 16 },
      animate: { opacity: 1, y: 0 },
      transition: { duration: .85, delay: .06 + i * .11, ease: EASE }
    },
    reveal: (i = 0) => reduce ? {} : {
      initial: { opacity: 0, y: 22 },
      whileInView: { opacity: 1, y: 0 },
      viewport: { once: true, amount: .25 },
      transition: { duration: .7, delay: i * .08, ease: EASE }
    },
    press: reduce ? {} : { whileHover: { y: -1 }, whileTap: { scale: .985 } }
  };
}

/* ------------------------------------------------------------------ bits */
const WRAP = "mx-auto w-full max-w-[82rem] px-5 sm:px-8";

/* The accent is for flat grounds only. Measured over the washed photograph
   it reads 2.48:1 in light and 2.17:1 in dark, both well under the 4.5:1
   small text needs, which is the rule the house file already carries: only
   ink crosses the picture in light, only bone in dark. On paper-3 the brick
   is 5.63:1 and on ink the light brick is 6.1:1, so it keeps the sections
   that sit on a flat ground. */
function Eyebrow({ children, on = "flat" }) {
  const tone = on === "photo"
    ? "text-ink/75 dark:text-bone/75"
    : "text-brick dark:text-brick-l";
  return html`<p class="font-mono text-[11px] uppercase tracking-[.18em] ${tone}">${children}</p>`;
}

function Action({ href, children, tone = "solid", class: extra = "", ...rest }) {
  const mo = useMo();
  const base = "inline-flex items-center justify-center whitespace-nowrap rounded-full px-6 py-3 text-[15px] font-medium transition-colors";
  const tones = {
    /* Button contrast, measured. Bone on ink is 11.9:1 and ink on bone is the
       same figure inverted, so the primary passes AA in both modes with room
       to spare. The ghost carries a 1px stroke rather than relying on the
       ground behind it, which over a photograph is the skill's hard rule. */
    solid: "bg-ink text-bone hover:bg-ink/90 dark:bg-bone dark:text-ink dark:hover:bg-bone/90",
    ghost: "border border-ink/25 text-ink hover:border-ink/60 dark:border-bone/30 dark:text-bone dark:hover:border-bone/70"
  };
  /* The caller's class joins the button's rather than replacing it. Spread
     last, a passed class silently wiped the pill and the nav action rendered
     as plain text. */
  return html`<${M.a} href=${href} class="${base} ${tones[tone]} ${extra}" ...${mo.press} ...${rest}>${children}<//>`;
}

/* ------------------------------------------------------------------- nav */
function Nav({ theme, onToggle }) {
  const links = [["Open now", "#open"], ["The case", "#case"], ["What it is", "#standard"], ["Price", "#price"]];
  return html`
    <header class="sticky top-0 z-40 border-b border-ink/10 bg-paper/85 backdrop-blur-md dark:border-bone/10 dark:bg-ink-2/85">
      <div class="${WRAP} flex h-[68px] items-center justify-between gap-6">
        <a href="#top" class="font-mono text-[13px] uppercase tracking-[.22em]">Arvorealta</a>
        <nav class="hidden items-center gap-7 lg:flex">
          ${links.map(([l, h]) => html`
            <a key=${l} href=${h}
               class="text-[14px] text-ink/70 transition-colors hover:text-ink dark:text-bone/70 dark:hover:text-bone">${l}</a>`)}
        </nav>
        <div class="flex items-center gap-3">
          <button type="button" onClick=${onToggle}
            aria-label="${theme === "dark" ? "Switch to light mode" : "Switch to dark mode"}"
            class="grid size-9 place-items-center rounded-full border border-ink/20 transition-colors hover:border-ink/50 dark:border-bone/25 dark:hover:border-bone/60">
            <span class="font-mono text-[11px]">${theme === "dark" ? "L" : "D"}</span>
          </button>
          <${Action} href="mailto:atlas@arvorealta.com?subject=One%20page%20from%20a%20tender%20we%20lost"
            class="hidden sm:inline-flex">Get your page scored<//>
        </div>
      </div>
    </header>`;
}

/* ------------------------------------------------------------------ hero
   Asymmetric split at DESIGN_VARIANCE 7: the type holds seven of twelve
   columns on the left and the photograph's own subject occupies the right,
   so the composition is the picture's rather than a box drawn over it.
   Four text objects and no more, and the action is the last of them. */
function Hero() {
  const mo = useMo();
  return html`
    <section id="top" class="relative isolate overflow-clip bg-paper-3 dark:bg-ink">
      <picture class="absolute inset-0 block">
        <source type="image/webp" sizes="100vw"
          srcset="/assets/img/gateway-2-960.webp 960w, /assets/img/gateway-2-1440.webp 1440w, /assets/img/gateway-2-1920.webp 1920w, /assets/img/gateway-2-2560.webp 2560w" />
        <img src="/assets/img/gateway-2-1920.jpg" sizes="100vw"
          srcset="/assets/img/gateway-2-960.jpg 960w, /assets/img/gateway-2-1440.jpg 1440w, /assets/img/gateway-2-1920.jpg 1920w, /assets/img/gateway-2-2560.jpg 2560w"
          width="2576" height="1399" alt="" fetchpriority="high" decoding="async"
          class="size-full object-cover object-[50%_45%] [opacity:var(--hero-photo)]" />
      </picture>

      <!-- The vignette is off. With the wash gone it would be the only layer
           left on top of the picture, and a fade to paper around a photograph
           meant to be seen at full strength reads as a smudge. The band ends
           on a hard edge against the fold below, which is what a full-bleed
           image band normally does. The gradient, if it comes back:
           radial-gradient(135% 120% at 52% 44%, transparent 28%,
           var(--color-paper-3) 70%, var(--color-paper) 99%) in light, and the
           same stops in --color-ink and --color-ink-2 in dark. -->

      <div class="${WRAP} relative grid min-h-[clamp(30rem,calc(100dvh-4.5rem),46rem)] content-center py-14">
        <!-- Asymmetric split, DESIGN_VARIANCE 7. The headline takes the full
             measure because at this size it needs 995px to hold two lines and
             a body column cannot give it that; everything under it stays at
             reading width, so the block narrows as it descends and the
             photograph's subject keeps the right of the frame. -->
        <div>
          <${M.div} ...${mo.rise(0)}><${Eyebrow} on="photo">Industrial manufacturers bidding in the Nordics<//><//>
          <${M.h1} ...${mo.rise(1)}
            class="mt-7 text-[clamp(2.4rem,.9rem+4.4vw,4.6rem)] font-medium leading-[1.03] tracking-[-.03em]">
            Nobody told you which page<br class="hidden lg:inline" /> cost you the contract.
          <//>
          <${M.p} ...${mo.rise(2)}
            class="mt-8 max-w-[44ch] text-[clamp(1.05rem,.98rem+.35vw,1.25rem)] leading-[1.6] text-ink/80 dark:text-bone/80">
            Public buyers score the documents you hand in. Not the plant, not the price list, not the twenty years.
          <//>
          <${M.div} ...${mo.rise(3)} class="mt-10 flex flex-wrap items-center gap-3">
            <${Action} href="mailto:atlas@arvorealta.com?subject=One%20page%20from%20a%20tender%20we%20lost">Get your page scored<//>
            <${Action} href="#open" tone="ghost">See the open tender<//>
          <//>
        </div>
      </div>
    </section>`;
}

/* ------------------------------------------------- the terms, as a strip */
function Gate() {
  const mo = useMo();
  const rows = [
    ["Who this is for", "The person writing the bid between tasks."],
    ["What the first step costs", "Send one page from a tender you lost. No charge and no call."]
  ];
  return html`
    <section class="${WRAP} border-b border-ink/10 py-14 dark:border-bone/10">
      <div class="grid gap-10 md:grid-cols-2 md:gap-16">
        ${rows.map(([k, v], i) => html`
          <${M.div} key=${k} ...${mo.reveal(i)}>
            <p class="font-mono text-[11px] uppercase tracking-[.18em] text-ink/55 dark:text-bone/55">${k}</p>
            <p class="mt-3 max-w-[44ch] text-[1.05rem] leading-[1.65]">${v}</p>
          <//>`)}
      </div>
    </section>`;
}

/* --------------------------------------------- the open tender, as fields */
function OpenTender() {
  const mo = useMo();
  const fields = [
    ["Tender deadline", "27 Oct 2026, 12:00"],
    ["Questions close", "19 Oct 2026"],
    ["Weight that is not price", "65%"]
  ];
  return html`
    <section id="open" class="${WRAP} py-20 sm:py-28">
      <${M.div} ...${mo.reveal(0)}>
        <${Eyebrow}>Open now<//>
        <h2 class="mt-6 max-w-[20ch] text-[clamp(1.9rem,1.2rem+2.2vw,3.1rem)] font-medium leading-[1.08] tracking-[-.025em]">
          If you are bidding on this one, the hard attachment is already written.
        </h2>
      <//>

      <${M.div} ...${mo.reveal(1)}
        class="mt-12 grid overflow-hidden rounded-2xl border border-ink/15 bg-paper-3 lg:grid-cols-[1.15fr_1fr] dark:border-bone/15 dark:bg-ink">
        <div class="border-b border-ink/12 p-8 sm:p-10 lg:border-b-0 lg:border-r dark:border-bone/12">
          <h3 class="text-[1.5rem] font-medium leading-tight tracking-[-.02em]">Leveranse av avfallsbeholdere</h3>
          <p class="mt-3 text-[.95rem] leading-relaxed text-ink/70 dark:text-bone/70">
            Valdres Kommunale Renovasjon IKS, Norway. Framework agreement, four years.
          </p>
          <p class="mt-7 max-w-[46ch] leading-[1.7]">
            Bilag 2 and bilag 3 are handed out as finished forms. Vedlegg 5 is not, and it is where the quality and the environment weight is read.
          </p>
          <div class="mt-8">
            <${Action} href="/mal/" tone="ghost">Open the template<//>
          </div>
        </div>

        <!-- Fields, not rows. A deadline is scanned rather than read, so the
             figure sits above its own name at display weight and there is no
             hairline under anything. -->
        <dl class="grid content-center gap-8 p-8 sm:p-10">
          ${fields.map(([k, v]) => html`
            <div key=${k}>
              <dd class="font-mono text-[1.6rem] leading-none tracking-[-.02em]">${v}</dd>
              <dt class="mt-2 font-mono text-[11px] uppercase tracking-[.18em] text-ink/55 dark:text-bone/55">${k}</dt>
            </div>`)}
        </dl>
      <//>

      <${M.p} ...${mo.reveal(2)} class="mt-8 max-w-[58ch] text-[.95rem] leading-[1.7] text-ink/65 dark:text-bone/65">
        One tender today, and that is the whole list rather than the top of it. Another appears here when a notice has been read closely enough to write its attachment.
      <//>
    </section>`;
}

/* --------------------------------------- the weighting, drawn to its size */
function Weighting() {
  const mo = useMo();
  const reduce = useReducedMotion();
  const segs = [["Quality and environment", 65], ["Price", 35]];
  return html`
    <section id="case" class="bg-ink py-20 text-bone sm:py-28 dark:bg-ink">
      <div class="${WRAP}">
        <${M.h2} ...${mo.reveal(0)}
          class="max-w-[22ch] text-[clamp(1.9rem,1.2rem+2.2vw,3.1rem)] font-medium leading-[1.08] tracking-[-.025em]">
          Most of the score is not the price.
        <//>
        <${M.div} ...${mo.reveal(1)} class="mt-12 flex max-w-[56rem] overflow-hidden rounded-xl border border-bone/20">
          ${segs.map(([label, pct], i) => html`
            <${M.div} key=${label}
              initial=${reduce ? false : { flexGrow: 0 }}
              whileInView=${{ flexGrow: pct }}
              viewport=${{ once: true, amount: .4 }}
              transition=${{ duration: .9, delay: .15 + i * .1, ease: EASE }}
              style=${{ flexGrow: reduce ? pct : undefined, flexBasis: 0 }}
              class="${i === 0 ? "bg-bone/15 border-r border-bone/20" : "bg-bone/[.05]"} px-6 py-10">
              <p class="font-mono text-[2rem] leading-none tracking-[-.02em]">${pct}</p>
              <p class="mt-3 font-mono text-[11px] uppercase tracking-[.18em] text-bone/65">${label}</p>
            <//>`)}
        <//>
        <${M.p} ...${mo.reveal(2)} class="mt-8 max-w-[56ch] leading-[1.7] text-bone/75">
          Read from the award criteria in the notice itself. Norwegian authorities have had to weight climate and environment at a minimum of 30% since January 2024, and this tender sits exactly on that floor.
        <//>
      </div>
    </section>`;
}

/* ----------------------------------------------------------------- close */
function Close() {
  const mo = useMo();
  return html`
    <section class="${WRAP} py-24 sm:py-32">
      <${M.div} ...${mo.reveal(0)} class="max-w-[52ch]">
        <h2 class="text-[clamp(1.9rem,1.2rem+2.2vw,3.1rem)] font-medium leading-[1.08] tracking-[-.025em]">
          Before you spend €2,400 finding out, spend nothing.
        </h2>
        <p class="mt-7 leading-[1.7] text-ink/80 dark:text-bone/80">
          Send one page from a tender you lost. A method statement, a quality section, a capability answer. It comes back scored against the criteria it was judged on, with the points located and the reasoning written out.
        </p>
        <div class="mt-10">
          <${Action} href="mailto:atlas@arvorealta.com?subject=One%20page%20from%20a%20tender%20we%20lost">Get your page scored<//>
        </div>
      <//>
    </section>
    <footer class="border-t border-ink/10 py-10 dark:border-bone/10">
      <div class="${WRAP} flex flex-wrap items-center justify-between gap-4 font-mono text-[11px] uppercase tracking-[.18em] text-ink/55 dark:text-bone/55">
        <span>Arvorealta</span>
        <a href="mailto:atlas@arvorealta.com" class="transition-colors hover:text-ink dark:hover:text-bone">atlas@arvorealta.com</a>
      </div>
    </footer>`;
}

/* ------------------------------------------------------------------- app */
function App() {
  const [theme, setTheme] = useState(() => document.documentElement.getAttribute("data-theme") || "light");

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("ar-theme", theme) } catch (e) {}
  }, [theme]);

  /* Follow the system until the reader overrides it, and keep following it
     for as long as they have not. */
  useEffect(() => {
    const mq = matchMedia("(prefers-color-scheme: dark)");
    const on = e => { let s = null; try { s = localStorage.getItem("ar-theme") } catch (err) {} if (!s) setTheme(e.matches ? "dark" : "light") };
    mq.addEventListener("change", on);
    return () => mq.removeEventListener("change", on);
  }, []);

  const toggle = useCallback(() => setTheme(t => t === "dark" ? "light" : "dark"), []);

  return html`
    <${React.Fragment}>
      <${Nav} theme=${theme} onToggle=${toggle} />
      <main>
        <${Hero} />
        <${Gate} />
        <${OpenTender} />
        <${Weighting} />
        <${Close} />
      </main>
    <//>`;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
