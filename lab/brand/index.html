<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brand — the mosaic (sandbox)</title>
<meta name="description" content="Sandbox. Seventeen marks, three grounds each, as a mosaic you can zoom and open.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#11261F">

<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/geist-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/geist-mono-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/ebgaramond-latin.woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts/geist.css">
<link rel="stylesheet" href="/assets/fonts/ebgaramond.css">
<link rel="stylesheet" href="/lab/tw-051e8707.css">

<style>
/* ────────────────────────────────────────────────── the room

   The reference is the iPhone Photos library: a mosaic you pinch to change
   density, a tap that expands one picture into the whole screen, and a way
   to keep moving once you are in there. Everything here serves that and
   nothing else.

   The landscape source is what makes it possible. The portrait set was 9:16
   and could never fill a screen; these are 16:9, so a tile, a mosaic cell
   and a full-bleed view are all the same shape and nothing is cropped. */
html{background:var(--color-ink-2)}
body{overscroll-behavior-y:none}
body.locked{overflow:hidden}

.tile{display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;background:#0d1d18;
  border-radius:3px;overflow:hidden;cursor:zoom-in;position:relative;
  /* a tile is a button, so it needs a visible focus state of its own */
  outline-offset:3px}
.tile img{display:block;width:100%;height:100%;object-fit:cover}
.tile::after{content:"";position:absolute;inset:0;background:var(--color-bone);opacity:0;
  transition:opacity .35s ease;pointer-events:none}
.tile:hover::after{opacity:.07}
@media (prefers-reduced-motion:reduce){.tile::after{transition:none}}

.shade{position:fixed;inset:0;z-index:60;background:#070f0c;opacity:0;visibility:hidden;
  transition:opacity .45s ease,visibility .45s}
.shade.on{opacity:1;visibility:visible}

.view{position:fixed;inset:0;z-index:61;display:grid;
  /* minmax(0,1fr), never 1fr. An `fr` track is minmax(auto,1fr), and `auto`
     will not shrink below the content's min-content height — the picture's
     own 788px — so the stage grew past its row and ran 66px into the film
     strip. Same trap as the award bar's tracks on the offer page. */
  grid-template-rows:auto minmax(0,1fr) auto;
  visibility:hidden;pointer-events:none}
.view.on{visibility:visible;pointer-events:auto}
/* The picture is absolutely positioned, and that is a fix rather than a
   style. As a grid item its `max-height:100%` computed to `none` — a
   percentage max-height resolves against an indefinite containing block,
   and an `fr` row counts as indefinite — so the picture kept its intrinsic
   762px and ran into the film strip. Measured: max-height:500px bound and
   max-height:100% did not, on the same element.

   Absolute inside a position:relative stage gives a definite containing
   block, so the percentages resolve; `inset:0` with `margin:auto` and auto
   width and height is the old reliable way to centre a replaced element
   inside one. The element's box stays the picture's own box, which is what
   the shared-element animation needs — object-fit:contain on a full-size
   box would letterbox, and the tile would then expand into the wrong shape
   on a tall screen. */
.view-stage{position:relative;min-height:0;overflow:hidden}
.view-img{position:absolute;top:0;right:0;bottom:0;left:0;margin:auto;
  width:auto;height:auto;
  max-width:calc(100% - 2 * clamp(.5rem,3vw,3rem));
  max-height:calc(100% - 2 * clamp(.75rem,2vh,1.5rem));
  border-radius:3px}

/* The film strip is the panel the brief asked for: the rest of the library,
   always reachable without going back. It scrolls the current frame into the
   middle of itself rather than making the reader find it. */
.strip{display:flex;gap:6px;overflow-x:auto;padding:.75rem clamp(.75rem,3vw,2rem) 1rem;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;width:92px;aspect-ratio:16/9;border:0;padding:0;border-radius:2px;
  overflow:hidden;cursor:pointer;background:#0d1d18;opacity:.4;transition:opacity .25s ease}
.strip button img{display:block;width:100%;height:100%;object-fit:cover}
.strip button[aria-current="true"]{opacity:1;outline:1.5px solid var(--color-bone);outline-offset:1px}
.strip button:hover{opacity:.8}

.ghost{width:100%;aspect-ratio:16/9;border-radius:3px;background:rgba(233,231,228,.06)}

.arrow{position:absolute;top:50%;translate:0 -50%;z-index:62;width:46px;height:46px;border:0;
  border-radius:999px;background:rgba(233,231,228,.1);color:var(--color-bone);cursor:pointer;
  display:grid;place-items:center;font-size:20px;line-height:1;backdrop-filter:blur(6px);
  transition:background .2s ease}
.arrow:hover{background:rgba(233,231,228,.22)}
.arrow[disabled]{opacity:.25;cursor:default}
.arrow.prev{left:clamp(.4rem,2vw,1.5rem)} .arrow.next{right:clamp(.4rem,2vw,1.5rem)}
@media (max-width:40rem){.arrow{display:none}}
</style>
</head>

<body class="bg-ink-2 font-sans text-bone antialiased">
<div id="root"></div>
<noscript style="display:block;padding:4rem 1.25rem;max-width:40rem;margin:0 auto">
  <h1 style="font-family:'EB Garamond',serif;font-size:2.5rem;line-height:1.05;margin:0 0 1.5rem">Brand and identity</h1>
  <p style="line-height:1.6">Seventeen marks, each shown on three grounds. This sandbox needs scripting;
  the live page at <a href="/brand/" style="color:inherit">arvorealta.com/brand</a> does not.</p>
</noscript>

<script type="module">
import { React, createRoot, motion, useReducedMotion, htm } from "/assets/vendor/runtime.js";
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const html = htm.bind(React.createElement);
const M = motion;

/* ── the library ─────────────────────────────────────────────────────────
   Seventeen projects, three grounds each, in the order the source frames
   come in. Every name was read at full resolution before it was written
   here, and every second line is what the lockup itself states — a sector
   inferred from a company name would be invented proof. */
const GROUNDS = [["w", "Deep water"], ["l", "Warm light"], ["p", "Bare paper"]];
const PROJECTS = [
  ["remedios",   "Ilha dos Remédios",             "Crest and seal"],
  ["demillion",  "Demillion",                     "Landscapes"],
  ["venner",     "Venner",                        "Advice"],
  ["lobo",       "Leonardo Lobo",                 "Negócios imobiliários"],
  ["boaventura", "Boaventura Noleto Sousa Souto", "Advogados"],
  ["figueiredo", "Figueiredo & Velloso",          "Advogados associados"],
  ["dantas",     "Dantas & Martins",              "Advogadas associadas"],
  ["wright",     "Wright Minussi",                "Advogados"],
  ["machado",    "Machado Gobbo",                 "Advogados"],
  ["offrire",    "Offrire",                       "Hospitais"],
  ["soledad",    "Soledad Molina",                "Monogram and wordmark"],
  ["archy",      "Archy",                         "Mark and wordmark"],
  ["noleto",     "Noleto",                        "Mark and wordmark"],
  ["turvatikas", "Turvatikas",                    "Safety ladder"],
  ["amazonia",   "Amazônia Store",                "Store"],
  ["autotrack",  "Autotrack",                     "Mark and wordmark"],
  ["arvorealta", "Arvorealta",                    "Our own"],
];
const FRAMES = [];
PROJECTS.forEach(([slug, name, role]) => GROUNDS.forEach(([g, gname]) => FRAMES.push({
  id: `${slug}-${g}`, slug, name, role, gname,
  thumb: `/assets/land/${slug}-${g}-1-480.webp`,
  full:  `/assets/land/${slug}-${g}-1-1400.webp`,
  alt: `${name} — the mark on ${gname.toLowerCase()}`,
})));

/* Three densities, which is what pinching changes. Photos goes further in
   both directions; three is the whole useful range for 51 frames on a page
   this wide, and more steps would be a slider nobody moves twice. */
const ZOOMS = [
  { label: "S", cols: "repeat(auto-fill,minmax(min(100%,11rem),1fr))", gap: "6px" },
  { label: "M", cols: "repeat(auto-fill,minmax(min(100%,19rem),1fr))", gap: "10px" },
  { label: "L", cols: "repeat(auto-fill,minmax(min(100%,34rem),1fr))", gap: "16px" },
];
const SPRING = { type: "spring", stiffness: 260, damping: 32, mass: .9 };

function Tile({ f, i, hidden, onOpen, reduce }) {
  if (hidden) return html`<div class="ghost" key=${f.id} />`;
  return html`
    <button class="tile" key=${f.id} onClick=${() => onOpen(i)}
            aria-label=${`Open ${f.name}, ${f.gname}`}>
      <${M.img} layoutId=${f.id} src=${f.thumb} alt=${f.alt}
        width="480" height="270" loading="lazy" decoding="async"
        transition=${reduce ? { duration: 0 } : SPRING} />
    </button>`;
}

function App() {
  const reduce = useReducedMotion();
  const [zoom, setZoom] = useState(1);
  const [open, setOpen] = useState(null);
  const stripRef = useRef(null);
  const closeRef = useRef(null);
  const lastFocus = useRef(null);
  const isOpen = open !== null;
  const cur = isOpen ? FRAMES[open] : null;

  const go = useCallback(d => setOpen(o => {
    if (o === null) return o;
    const n = o + d;
    return n < 0 || n >= FRAMES.length ? o : n;
  }), []);

  const openAt = useCallback(i => {
    lastFocus.current = document.activeElement;
    setOpen(i);
  }, []);

  const close = useCallback(() => setOpen(null), []);

  /* The address bar is a navigation aid, not decoration: one frame is one
     URL, so a mark can be sent to somebody, and the device's own Back
     gesture closes the view instead of leaving the page. */
  useEffect(() => {
    if (isOpen) {
      if (location.hash !== `#${cur.id}`) history.pushState({ f: cur.id }, "", `#${cur.id}`);
    } else if (location.hash) {
      history.replaceState(null, "", location.pathname);
    }
  }, [isOpen, cur]);

  useEffect(() => {
    const onPop = () => setOpen(null);
    addEventListener("popstate", onPop);
    const i = FRAMES.findIndex(f => `#${f.id}` === location.hash);
    if (i >= 0) setOpen(i);
    return () => removeEventListener("popstate", onPop);
  }, []);

  useEffect(() => {
    document.body.classList.toggle("locked", isOpen);
    if (isOpen && closeRef.current) closeRef.current.focus();
    if (!isOpen && lastFocus.current) { try { lastFocus.current.focus() } catch (e) {} }
  }, [isOpen]);

  useEffect(() => {
    const onKey = e => {
      if (e.key === "Escape" && isOpen) { e.preventDefault(); close(); }
      else if (e.key === "ArrowRight" && isOpen) go(1);
      else if (e.key === "ArrowLeft" && isOpen) go(-1);
      else if (!isOpen && (e.key === "+" || e.key === "=")) setZoom(z => Math.min(2, z + 1));
      else if (!isOpen && e.key === "-") setZoom(z => Math.max(0, z - 1));
    };
    addEventListener("keydown", onKey);
    return () => removeEventListener("keydown", onKey);
  }, [isOpen, go, close]);

  /* Pinch. On a trackpad the browser reports it as a wheel event with
     ctrlKey set; on iOS Safari there is no such wheel, so two touches are
     measured directly. Both land on the same three steps. */
  useEffect(() => {
    if (isOpen) return;
    const onWheel = e => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      setZoom(z => Math.max(0, Math.min(2, z + (e.deltaY > 0 ? -1 : 1))));
    };
    let d0 = null;
    const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    const onStart = e => { if (e.touches.length === 2) d0 = dist(e.touches); };
    const onMove = e => {
      if (e.touches.length !== 2 || d0 === null) return;
      const d = dist(e.touches), r = d / d0;
      if (r > 1.35) { setZoom(z => Math.min(2, z + 1)); d0 = d; }
      else if (r < 0.74) { setZoom(z => Math.max(0, z - 1)); d0 = d; }
    };
    const onEnd = () => { d0 = null };
    addEventListener("wheel", onWheel, { passive: false });
    addEventListener("touchstart", onStart, { passive: true });
    addEventListener("touchmove", onMove, { passive: true });
    addEventListener("touchend", onEnd, { passive: true });
    return () => {
      removeEventListener("wheel", onWheel);
      removeEventListener("touchstart", onStart);
      removeEventListener("touchmove", onMove);
      removeEventListener("touchend", onEnd);
    };
  }, [isOpen]);

  /* Swipe inside the view. */
  const touch = useRef(null);
  const onTouchStart = e => { touch.current = e.touches[0].clientX };
  const onTouchEnd = e => {
    if (touch.current === null) return;
    const dx = e.changedTouches[0].clientX - touch.current;
    if (Math.abs(dx) > 48) go(dx < 0 ? 1 : -1);
    touch.current = null;
  };

  useEffect(() => {
    if (!isOpen || !stripRef.current) return;
    const el = stripRef.current.children[open];
    if (el && el.scrollIntoView) el.scrollIntoView({ inline: "center", block: "nearest", behavior: reduce ? "auto" : "smooth" });
  }, [open, isOpen, reduce]);

  const z = ZOOMS[zoom];

  return html`
    <header class="sticky top-0 z-40 border-b border-bone/10 bg-ink-2/85 backdrop-blur-md">
      <div class="mx-auto flex w-full max-w-[110rem] items-center justify-between gap-4 px-4 py-3 sm:px-6">
        <a href="/brand/" class="font-mono text-[11px] uppercase tracking-[.2em] text-bone/70 transition-colors hover:text-bone">←  the live page</a>
        <div class="flex items-center gap-4">
          <span class="hidden font-mono text-[11px] uppercase tracking-[.2em] text-bone/40 sm:inline">${FRAMES.length} frames · ${PROJECTS.length} marks</span>
          <div class="flex items-center gap-1 rounded-full border border-bone/15 p-1" role="group" aria-label="Thumbnail size">
            ${ZOOMS.map((o, i) => html`
              <button key=${o.label} onClick=${() => setZoom(i)} aria-pressed=${i === zoom}
                class=${"h-7 w-7 rounded-full font-mono text-[11px] transition-colors " +
                  (i === zoom ? "bg-bone text-ink-2" : "text-bone/60 hover:text-bone")}>${o.label}</button>`)}
          </div>
        </div>
      </div>
    </header>

    <main class="mx-auto w-full max-w-[110rem] px-4 pb-24 pt-6 sm:px-6">
      <h1 class="sr-only">Brand and identity — seventeen marks</h1>
      <div style=${{ display: "grid", gridTemplateColumns: z.cols, gap: z.gap }}>
        ${FRAMES.map((f, i) => html`<${Tile} key=${f.id} f=${f} i=${i}
            hidden=${open === i} onOpen=${openAt} reduce=${reduce} />`)}
      </div>
      <p class="mt-10 font-mono text-[11px] uppercase tracking-[.16em] text-bone/35">
        Pinch, or S · M · L, to change the size. Tap a frame to open it.
      </p>
    </main>

    <div class=${"shade" + (isOpen ? " on" : "")} onClick=${close} aria-hidden="true"></div>

    <div class=${"view" + (isOpen ? " on" : "")} role="dialog" aria-modal=${isOpen}
         aria-label=${cur ? `${cur.name}, ${cur.gname}` : "Frame"}
         onTouchStart=${onTouchStart} onTouchEnd=${onTouchEnd}>
      <div class="flex items-start justify-between gap-4 px-4 pt-4 sm:px-6">
        <div>
          <p class="font-mono text-[11px] uppercase tracking-[.18em] text-bone/50">
            ${isOpen ? String(open + 1).padStart(2, "0") : "00"} <span class="text-bone/30">/ ${FRAMES.length}</span>
          </p>
          <h2 class="mt-2 font-display text-[clamp(1.4rem,1rem_+_1.4vw,2.4rem)] leading-tight">${cur ? cur.name : ""}</h2>
          <p class="mt-1 font-mono text-[11px] uppercase tracking-[.16em] text-bone/55">
            ${cur ? cur.role : ""} <span class="text-bone/30">· ${cur ? cur.gname : ""}</span>
          </p>
        </div>
        <button ref=${closeRef} onClick=${close} aria-label="Close"
          class="h-11 w-11 shrink-0 rounded-full border border-bone/20 text-bone/80 transition-colors hover:border-bone/60 hover:text-bone">✕</button>
      </div>

      <div class="view-stage">
        ${cur ? html`<${M.img} key=${cur.id} layoutId=${cur.id} class="view-img"
            src=${cur.full} alt=${cur.alt} width="1400" height="788"
            transition=${reduce ? { duration: 0 } : SPRING} />` : null}
      </div>

      <button class="arrow prev" onClick=${() => go(-1)} disabled=${open === 0} aria-label="Previous">‹</button>
      <button class="arrow next" onClick=${() => go(1)} disabled=${open === FRAMES.length - 1} aria-label="Next">›</button>

      <div class="strip" ref=${stripRef} role="tablist" aria-label="All frames">
        ${FRAMES.map((f, i) => html`
          <button key=${f.id} onClick=${() => setOpen(i)} aria-current=${i === open}
                  aria-label=${`${f.name}, ${f.gname}`}>
            <img src=${f.thumb} alt="" width="92" height="52" loading="lazy" decoding="async" />
          </button>`)}
      </div>
    </div>`;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
