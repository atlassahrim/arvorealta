name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages (enables it if not already on)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Withhold internal work from the public site
        # GitHub Pages on a public repo has no access control. robots.txt and
        # noindex only ask search engines nicely; anyone with the URL still
        # gets the page. Not deploying a path is the only real lock, so the
        # internal work is deleted from the checkout before the artifact is
        # built. Nothing is removed from the repo itself: sessions edit these
        # files in the working tree, and deck-pdf.yml prints from the working
        # tree too, so PDF export is unaffected.
        #
        # The rule is the leading underscore. deck/_template stays private;
        # deck/acme, a real client deck, publishes as normal. .claude is on
        # the list for the same reason — agent skills are tooling, not site.
        run: rm -rf templates deck/_* annex/_* assets/_og .claude

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
