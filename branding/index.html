<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved to /brand/ — Arvorealta</title>
<!-- This path was live for part of one day and the link may have been sent
     to somebody before it was renamed. A public path stays public, so it
     keeps a stub rather than a 404. noindex so it never competes with the
     page it points at, and the refresh is immediate with a real link under
     it for anyone the refresh does not reach. -->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://arvorealta.com/brand/">
<meta http-equiv="refresh" content="0; url=/brand/">
<link rel="stylesheet" href="/assets/fonts/geist.css">
<style>
  html{background:#D9D7D4;color:#17352C}
  body{margin:0;display:grid;place-items:center;min-height:100dvh;
       font:400 1rem/1.6 "Geist",ui-sans-serif,system-ui,sans-serif;padding:1.5rem;text-align:center}
  a{color:inherit}
</style>
</head>
<body>
  <p>This page is now at <a href="/brand/">arvorealta.com/brand</a>.</p>
  <script>location.replace("/brand/")</script>
</body>
</html>
